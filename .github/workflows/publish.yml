name: Publish Creation

on:
  push:
    tags: ['creation-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creation-npm-release
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'ty-teams/promptframe-creation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate a release tag before installing dependencies
        if: github.event_name == 'push'
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node scripts/package-release.mjs check-release
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Build and check the single release tarball
        run: |
          node scripts/package-release.mjs pack "$RUNNER_TEMP/creation-package"
          node scripts/package-release.mjs smoke "$RUNNER_TEMP/creation-package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: creation-npm-${{ github.sha }}
          path: ${{ runner.temp }}/creation-package/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    if: github.repository == 'ty-teams/promptframe-creation' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/creation-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: creation-npm-${{ github.sha }}
          path: ${{ runner.temp }}/creation-package
      - name: Publish the verified tarball using npm OIDC
        run: node scripts/package-release.mjs publish "$RUNNER_TEMP/creation-package"
